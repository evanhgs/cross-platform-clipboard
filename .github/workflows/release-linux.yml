name: Release Linux

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    name: Bundle Linux
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libssl-dev
      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version 0.7.10 --locked
      - name: Create Linux packages
        run: |
          dx bundle --desktop \
            --package-types deb \
            --package-types appimage
      - name: Upload packages as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clipboard-history-linux-${{ github.sha }}
          path: target/dx/**/bundle/**
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mapfile -t packages < <(find target/dx -type f \( -name '*.deb' -o -name '*.AppImage' \))
          test "${#packages[@]}" -gt 0
          gh release create "$TAG" "${packages[@]}" --generate-notes --title "Clipboard History $TAG"
